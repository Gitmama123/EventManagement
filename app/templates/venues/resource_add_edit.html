{% extends 'base.html' %}
{% block content %}
<h2>{{ action }} Resource — {{ venue.name }}</h2>

<form method="POST">
  {{ form.hidden_tag() }}
  
  <div class="mb-3">
    {{ form.name.label }}
    {{ form.name(class_="form-control") }}
  </div>

  <div class="mb-3">
    {{ form.quantity.label }}
    {{ form.quantity(class_="form-control") }}
  </div>

  <button class="btn btn-primary">{{ action }}</button>
  <a class="btn btn-secondary" 
     href="{{ url_for('main.manage_resources', venue_id=venue.id) }}">Cancel</a>
</form>
{% endblock %}
