{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2>Users</h2>
  <a class="btn btn-primary" href="{{ url_for('main.admin_add_user') }}">Add User</a>
</div>

<div class="card">
  <div class="card-body p-0">
    <table class="table mb-0">
      <thead class="table-light">
        <tr>
          <th>Username</th>
          <th>Role</th>
          <th class="text-end">Actions</th>
        </tr>
      </thead>
      <tbody>
        {% for u in users %}
        <tr>
          <td>{{ u.username }}</td>
          <td>{{ u.role }}</td>
          <td class="text-end">
            <a class="btn btn-sm btn-outline-secondary" href="{{ url_for('main.admin_edit_user', uid=u.id) }}">Edit</a>
            {% if u.username != current_user.username %}
            <form action="{{ url_for('main.admin_delete_user', uid=u.id) }}" method="post" class="d-inline" onsubmit="return confirm('Delete user {{ u.username }}?');">
              <button type="submit" class="btn btn-sm btn-danger">Delete</button>
            </form>
            {% endif %}
          </td>
        </tr>
        {% else %}
        <tr>
          <td colspan="3" class="text-center text-muted py-3">No users found</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
